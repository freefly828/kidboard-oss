<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=800,height=480,initial-scale=1" />
<title>KidBoard 800x480</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:800px;height:480px;overflow:hidden;background:#fff;color:#000;font-family:Arial,"Noto Sans CJK SC",sans-serif}
.screen{width:800px;height:480px;border:2px solid #000;display:grid;grid-template-rows:54px 298px 77px 47px}
.header,.footer{display:flex;align-items:center;padding:0 18px}.header{justify-content:space-between;border-bottom:2px solid #000;font-size:22px;font-weight:700}.main{display:grid;grid-template-columns:1fr 1fr}.panel{padding:14px 18px}.panel:first-child{border-right:2px solid #000}.title{font-size:24px;font-weight:800;margin-bottom:12px}.item{font-size:22px;line-height:1.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.focus{border:2px solid #000;padding:0 6px;margin-left:-8px}.message{border-top:2px solid #000;padding:12px 18px;font-size:21px;line-height:1.35}.footer{border-top:2px solid #000;justify-content:space-around;font-size:18px;font-weight:700}
</style>
</head>
<body>
<div class="screen">
  <div class="header"><span>9月15日 周二</span><span>小朋友的今天</span><span>● 已同步</span></div>
  <div class="main">
    <section class="panel"><div class="title">今日安排</div><div class="item">08:20 到校</div><div class="item">09:10 数学</div><div class="item">10:20 体育</div><div class="item">15:00 放学</div></section>
    <section class="panel"><div class="title">今日任务</div><div class="item focus">&gt; □ 晨读 15分钟</div><div class="item">✓ 整理书包</div><div class="item">□ 英语听力 15分钟</div><div class="item">□ 阅读 20分钟</div></section>
  </div>
  <div class="message"><strong>家长留言：</strong>今天英语完成后可以看一会儿动画片。</div>
  <div class="footer"><span>DONE 完成</span><span>NEXT 下一项</span><span>BACK 返回</span></div>
</div>
</body>
</html>
